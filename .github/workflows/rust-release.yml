name: Rust Release

on:
  push:
    tags:
      - "rust-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            ext: ""

          - os: windows-latest
            name: windows-amd64
            ext: ".exe"

          - os: macos-latest
            name: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile
        run: |
          rustc src/msgdmp-to-pcap.rs -O -o msgdmp-to-pcap${{ matrix.ext }}

      - name: Rename and Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "msgdmp-to-pcap${{ matrix.ext }}" \
             "dist/msgdmp-to-pcap-${{ matrix.name }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msgdmp-to-pcap-${{ matrix.name }}
          path: dist/msgdmp-to-pcap-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: msgdmp-to-pcap-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
